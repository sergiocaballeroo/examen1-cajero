<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interfaz gráfica de un cajero automático: ingreso con NIP, consulta de saldo, retiro de efectivo y depósito a otra cuenta. Examen 1.">
  <title>Cajero automático · Banco Meridiano</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b2a5b'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23ffffff' stroke-width='5'/%3E%3Cpath d='M15 32h34' stroke='%23ffffff' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="atm" aria-label="Cajero automático">

    <!-- Parte superior: botones laterales, pantalla, botones laterales -->
    <div class="atm__superior">
      <div class="softkeys softkeys--izq" aria-label="Botones laterales izquierdos">
        <button type="button" class="softkey" data-slot="L1" aria-label="Botón lateral izquierdo 1"></button>
        <button type="button" class="softkey" data-slot="L2" aria-label="Botón lateral izquierdo 2"></button>
        <button type="button" class="softkey" data-slot="L3" aria-label="Botón lateral izquierdo 3"></button>
        <button type="button" class="softkey" data-slot="L4" aria-label="Botón lateral izquierdo 4"></button>
      </div>

      <section class="pantalla" id="pantalla" aria-live="polite">
        <header class="pantalla__barra">
          <span class="marca">
            <svg class="marca__logo" viewBox="0 0 64 64" aria-hidden="true">
              <circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="6"/>
              <path d="M10 32h44" stroke="currentColor" stroke-width="6"/>
            </svg>
            Banco Meridiano
          </span>
          <span class="pantalla__reloj" id="reloj" aria-live="off"></span>
        </header>
        <div class="pantalla__cuerpo" id="pantalla-cuerpo"></div>
      </section>

      <div class="softkeys softkeys--der" aria-label="Botones laterales derechos">
        <button type="button" class="softkey" data-slot="R1" aria-label="Botón lateral derecho 1"></button>
        <button type="button" class="softkey" data-slot="R2" aria-label="Botón lateral derecho 2"></button>
        <button type="button" class="softkey" data-slot="R3" aria-label="Botón lateral derecho 3"></button>
        <button type="button" class="softkey" data-slot="R4" aria-label="Botón lateral derecho 4"></button>
      </div>
    </div>

    <!-- Parte inferior: ranuras, teclado y dispensador -->
    <div class="atm__inferior">
      <div class="ranuras">
        <div class="ranura">
          <span class="ranura__etiqueta">Tarjeta</span>
          <div class="ranura__boca ranura__boca--tarjeta" id="ranura-tarjeta"></div>
        </div>
        <div class="ranura">
          <span class="ranura__etiqueta">Comprobante</span>
          <div class="ranura__boca ranura__boca--papel"></div>
        </div>
      </div>

      <div class="teclado" id="teclado" aria-label="Teclado numérico">
        <button type="button" class="tecla" data-tecla="1">1</button>
        <button type="button" class="tecla" data-tecla="2">2</button>
        <button type="button" class="tecla" data-tecla="3">3</button>
        <button type="button" class="tecla tecla--cancelar" data-tecla="cancelar">Cancelar</button>
        <button type="button" class="tecla" data-tecla="4">4</button>
        <button type="button" class="tecla" data-tecla="5">5</button>
        <button type="button" class="tecla" data-tecla="6">6</button>
        <button type="button" class="tecla tecla--borrar" data-tecla="borrar" aria-label="Borrar último dígito">Borrar</button>
        <button type="button" class="tecla" data-tecla="7">7</button>
        <button type="button" class="tecla" data-tecla="8">8</button>
        <button type="button" class="tecla" data-tecla="9">9</button>
        <button type="button" class="tecla tecla--aceptar" data-tecla="aceptar">Aceptar</button>
        <span class="tecla tecla--vacia" aria-hidden="true"></span>
        <button type="button" class="tecla" data-tecla="0">0</button>
        <span class="tecla tecla--vacia" aria-hidden="true"></span>
        <span class="tecla tecla--vacia" aria-hidden="true"></span>
      </div>

      <div class="dispensador">
        <span class="ranura__etiqueta">Efectivo</span>
        <div class="ranura__boca ranura__boca--efectivo" id="ranura-efectivo"></div>
        <p class="atm__aviso">Cubra el teclado al escribir su NIP. También funciona el teclado físico de su computadora.</p>
      </div>
    </div>

    <div class="modal" id="modal-inactividad" role="alertdialog" aria-modal="true" aria-labelledby="modal-titulo" hidden>
      <div class="modal__caja">
        <h2 id="modal-titulo">¿Sigue ahí?</h2>
        <p>Su sesión se cerrará en <strong id="modal-segundos">15</strong> segundos por inactividad.</p>
        <button type="button" class="btn btn--primario" id="btn-continuar" data-accion="continuar">Continuar</button>
      </div>
    </div>
  </main>

  <script src="js/validaciones.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
